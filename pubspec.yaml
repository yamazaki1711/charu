name: charu
description: "CHARU — Chinese text reader with integrated BKRS dictionary"
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Network
  dio: ^5.8.0+1

  # HTML Parsing
  html: ^0.15.5
  xml: ^6.5.0

  # Chinese Segmentation
  jieba_flutter: ^0.2.0

  # File Handling
  file_picker: ^8.3.7

  # Settings Storage
  shared_preferences: ^2.5.3

  # Archive / File decoding
  archive: ^3.6.1
  fast_gbk: ^1.0.0
  pinyin: ^3.3.0

  # Library (Wikisource books): storage path + traditional->simplified
  path_provider: ^2.1.5
  flutter_open_chinese_convert: ^1.0.0

  # Notifications
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/db/
    - assets/icons/
    - assets/library/
    - assets/dict.txt
    - assets/prob_emit.txt
    - assets/dict.big.txt
