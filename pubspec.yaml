name: charu
description: "CHARU — Chinese text reader with integrated BKRS dictionary"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Network
  dio: ^5.8.0+1

  # HTML Parsing
  html: ^0.15.5
  xml: ^6.5.0

  # Chinese Segmentation
  jieba_flutter: ^0.2.0

  # File Handling
  file_picker: ^8.3.7

  # Settings Storage
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/db/
    - assets/icons/
    - assets/dict.txt
    - assets/prob_emit.txt
    - assets/dict.big.txt
